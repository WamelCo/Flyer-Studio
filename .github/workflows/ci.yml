name: CI

# Every push to main and every pull request runs the full gate from CLAUDE.md:
# lint, typecheck, the test suites, the WCAG contrast audit, production builds, browser
# smoke tests and the container image. No secrets needed: external services are mocked or unused.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Placeholders so the build and the signed-out smoke tests run without real services.
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (every app and package)
        run: pnpm typecheck

      - name: Database — migrations, credits, passes, upkeep (PGlite)
        run: pnpm test:db

      - name: WhatsApp bot (PGlite, fake channel)
        run: pnpm test:whatsapp

      - name: Storage helpers (keys, public URLs, image sniffing)
        run: pnpm test:storage

      - name: Art director (mock provider)
        run: pnpm test:director

      - name: Ideogram pipeline (mock API)
        run: pnpm test:ideogram

      - name: WCAG contrast audit
        run: pnpm audit:contrast

      - name: Design lint, renderer and review loop (mock vision model)
        run: pnpm test:design

      - name: Design benchmark (100 prompts × every format, lint gate)
        run: pnpm benchmark

      - name: Photoshop and Illustrator exports
        run: pnpm test:export

      - name: Paynow payments (documented hash examples, mock Paynow)
        run: pnpm test:paynow

      - name: Production builds (web, WhatsApp, migrations)
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @flyer/web exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the container image (web + WhatsApp + Postgres)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: flyer-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
