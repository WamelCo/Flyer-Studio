<!doctype html>
<html>
  <body style="margin:0;padding:40px 16px;background:#F5F5F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1D1D1F;">
    <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#FFFFFF;border-radius:16px;padding:32px;">
      <tr>
        <td>
          <p style="margin:0 0 8px;font-size:17px;font-weight:600;">Sign in to Flyer Studio</p>
          <p style="margin:0 0 24px;font-size:16px;line-height:1.4;color:#86868B;">Enter this code in the open tab, or use the button below.</p>
          <p style="margin:0 0 24px;font-size:34px;font-weight:700;letter-spacing:0.2em;">{{ .Token }}</p>
          <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#0071E3;color:#FFFFFF;text-decoration:none;font-size:16px;padding:12px 20px;border-radius:8px;">Sign in</a>
          <p style="margin:24px 0 0;font-size:12px;color:#86868B;">If you didn't request this, you can ignore this email.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
