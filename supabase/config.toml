# Local development settings. Unlisted keys use Supabase CLI defaults.
project_id = "ai-flyer-generator"

[api]
port = 54321

[db]
port = 54322
major_version = 17

[studio]
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/confirm"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 8
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Your Flyer Studio sign-in code"
content_path = "./supabase/templates/magic_link.html"
